 <div class=verdict>
 <p>
 <strong>The app itself is in good shape.</strong> The parts of an App Store submission that
 most first-time apps fail — user-generated-content safety, privacy disclosure, in-app account
 deletion, data security — are genuinely built here, and several are enforced in Postgres rather
 than in the client, which is stronger than what Apple asks for. Nothing in the binary is a
 rejection on its own.
 </p>
 <p>
 <strong>What stands between this and a clean submission is mostly outside the binary.</strong>
 Three of the four blockers are metadata and release plumbing — a hosted privacy policy, a
 support URL, a real submit configuration — and the fourth is a promise the app makes to users
 that it currently has no mechanism to keep. All four are a day's work. Do those, walk the
 App Store Connect checklist at the end, and this is ready.
 </p>
 </div>

 <div class=sec-head>

 <section class=finding>
 <div class=gutter>
 <span class=fid>B1</span>
 <span class=&quot;sev t-block&quot;>Blocker</span>
 <span class=cite>5.1.1(i) Privacy policies<br>1.5 Developer information<br>2.1 App completeness</span>
 <span class=&quot;st st-done&quot;>Closed — 12 Sep</span>
 </div>
 <div class=body>
 <h3>There is no privacy policy URL and no support URL — only an in-app screen and a mailto: link</h3>
 <p>
 The privacy policy, terms, and community guidelines all exist as in-app screens, and they're
 well written. But App Store Connect requires a <strong>Privacy Policy URL</strong> and a
 <strong>Support URL</strong>, and both fields take a real <code>https://</code> address.
 An in-app screen cannot be pasted into either one, and a <code>mailto:</code> is not accepted
 as a Support URL.
 </p>
 <div class=evidence>
 <div>Every outbound link in the app is a mailto:</div>
 <div><b>src/screens/PrivacyPolicyScreen.tsx:96</b>       Linking.openURL('mailto:axis.app@outlook.com')</div>
 <div><b>src/screens/TermsOfServiceScreen.tsx:93</b>       Linking.openURL('mailto:axis.app@outlook.com')</div>
 <div><b>src/screens/CommunityGuidelinesScreen.tsx:73</b>  Linking.openURL('mailto:axis.app@outlook.com')</div>
 <div><b>src/screens/SettingsScreen.tsx:78</b>             SUPPORT_EMAIL = 'axis.app@outlook.com'</div>
 <div> </div>
 <div>No https:// destination exists anywhere in src/.</div>
 </div>
 <div class=fix>
 <span class=lbl>Fix</span>
 <p>
 Publish the three legal documents as static web pages — GitHub Pages off this repo is
 enough, and the copy already exists to paste. That gives you a Privacy Policy URL, a
 Support URL, and a Marketing URL from one afternoon. Keep the in-app screens exactly as
 they are; Apple wants the policy reachable in both places, and you already have the
 harder half.
 </p>
 </div>
 </div>
 </section>
 <section class=finding>
 <div class=gutter>
 <span class=fid>B2</span>
 <span class=&quot;sev t-block&quot;>Blocker</span>
 <span class=cite>Release infrastructure<br>(no build → no review)</span>
 </div>
 <div class=body>
 <h3>The submit configuration is still placeholder text, and the repo isn't linked to an EAS project</h3>
 <p>
 <code>eas.json</code> carries literal placeholders where the Apple identifiers go, and
 <code>app.json</code> has no <code>extra.eas.projectId</code> and no <code>owner</code> — yet
 <code>eas.json</code> sets <code>appVersionSource: &quot;remote&quot;</code>, which resolves the build
 number <em>from</em> the linked EAS project. There is currently no path from this repo to a
 binary in App Store Connect.
 </p>
 <div class=evidence>
 <div><b>eas.json</b> — submit.production.ios</div>
 <div>  &quot;appleId&quot;:     &quot;REPLACE_WITH_APPLE_ID_EMAIL&quot;</div>
 <div>  &quot;ascAppId&quot;:    &quot;REPLACE_WITH_APP_STORE_CONNECT_APP_ID&quot;</div>
 <div>  &quot;appleTeamId&quot;: &quot;REPLACE_WITH_APPLE_TEAM_ID&quot;</div>
 <div> </div>
 <div><b>app.json</b> — no `extra` block at all, and no `owner`</div>
 </div>
 <div class=fix>
 <span class=lbl>Fix</span>
 <p>
 Run <code>eas init</code> (writes <code>extra.eas.projectId</code>), create the app record
 in App Store Connect to get the <code>ascAppId</code>, then fill in all three identifiers.
 Do a <code>preview</code> build and install it on a real device before the production one —
 this is the first time the native project has ever been generated, and prebuild surprises
 surface there, not in Expo Go.
 </p>
 </div>
 </div>
 </section>
 <section class=finding>
 <div class=gutter>
 <span class=fid>B3</span>
 <span class=&quot;sev t-block&quot;>Blocker</span>
 <span class=cite>2.1 App completeness<br>(demo account)</span>
 </div>
 <div class=body>
 <h3>If the reviewer tests &quot;Delete account,&quot; they lock themselves out and the review dies there</h3>
 <p>
 Signup is gated to <code>@uwo.ca</code> addresses, so App Review <em>cannot</em> create an
 account and is entirely dependent on the demo login. That account is whitelisted at
 <span class=ref>0035_review_demo_account.sql</span> — and it uses
 <code>axis.app@outlook.com</code>, the same mailbox published as the support address in four
 places in the app.
 </p>
 <p>
 Reviewers routinely exercise Settings → Danger zone → Delete account, precisely because
 Apple requires it to exist. <code>delete_own_account()</code> then removes the account for
 real. The whitelist bypasses the domain gate and the 14-day cooldown at the database level,
 but the client blocks the reviewer from ever getting that far:
 </p>
 <div class=evidence>
 <div><b>src/screens/CreateAccountScreen.tsx</b> gates its submit button on isWesternEmail(),</div>
 <div>so a whitelisted non-uwo.ca address <b>cannot be typed into signup at all</b>.</div>
 <div> </div>
 <div>Net effect: reviewer deletes the demo account → cannot sign up → cannot sign in</div>
 <div>→ &quot;we were unable to sign in with the demo account provided&quot; → 2.1 rejection.</div>
 </div>
 <div class=fix>
 <span class=lbl>Fix</span>
 <ul>
 <li>Create <strong>two</strong> demo accounts on a dedicated mailbox, both in
 <code>signup_email_exceptions</code>, both created in the dashboard with
 <em>Auto Confirm User</em> ticked (the migration only whitelists the address — it does
 not create the user).</li>
 <li>Put both in App Review Notes with one line: <em>&quot;Account A is safe to delete when you
 test account deletion. Use Account B afterwards.&quot;</em></li>
 <li>Stop using the public support address as a login. Seed each demo account with a few
 listings and a conversation so the reviewer sees a populated app, not an empty one.</li>
 </ul>
 </div>
 </div>
 </section>
 <section class=finding>
 <div class=gutter>
 <span class=fid>B4</span>
 <span class=&quot;sev t-block&quot;>Blocker</span>
 <span class=cite>1.2 User-generated content<br>(developer responsibility)</span>
 <span class=&quot;st st-part&quot;>Partly closed</span>
 </div>
 <div class=body>
 <h3>The app publicly promises a 24-hour response to reports, and nothing tells anyone a report was filed</h3>
 <p>
 Both the Terms and the Community Guidelines commit to it in writing — which is the right
 instinct, and it's the kind of language Apple looks for. The problem is the other end.
 Reports land in <code>public.reports</code> and are readable only through the
 <code>reports_queue</code> view via Studio or a <code>service_role</code> connection. There
 is no webhook, no <code>pg_net</code> call, no email, no alert of any kind. A report is seen
 only if someone happens to open the Supabase dashboard that day.
 </p>
 <div class=evidence>
 <div><b>src/screens/TermsOfServiceScreen.tsx</b>          &quot;our team will review it within 24 hours&quot;</div>
 <div><b>src/screens/CommunityGuidelinesScreen.tsx</b>     &quot;responds within 24 hours&quot;</div>
 <div> </div>
 <div><b>0011 / 0012 / 0036</b>  no trigger, webhook, or pg_net call on reports INSERT</div>
 <div><b>supabase/README.md:180</b>  &quot;reports is a queue, not a full moderation system&quot;</div>
 </div>
 <p>
 Apple's current 1.2 language puts responsibility for acting on reported content squarely on
 the developer, and App Review can ask for a written remediation plan. A published SLA with
 no notification path is exactly the gap that gets cited — and it's a real user-safety gap
 independent of Apple.
 </p>
 <div class=fix>
 <span class=lbl>Fix</span>
 <p>
 Add a Supabase Database Webhook on <code>reports</code> INSERT that emails
 <code>axis.app@outlook.com</code> with the <code>reports_queue</code> row. That is a
 dashboard toggle and one edge function, and it makes the 24-hour promise keepable by one
 person. Write down the triage routine — who checks, how a listing or account gets removed,
 where the action is logged — because that document is what you hand App Review if they ask.
 Softening the copy is the lesser fix; the alerting is the real one.
 </p>
 </div>
 </div>
 </section>

 <div class=body>
 <h3>Four dashboard-only auth settings are unverified, and each one is load-bearing</h3>
 <p>
 Migration drift is clean — I confirmed <code>0001</code>–<code>0040</code> are all applied to

 <div class=fix>

 <section class=finding>
 <div class=gutter>
 <span class=fid>H2</span>
 <span class=&quot;sev t-high&quot;>High</span>
 <span class=cite>Tooling defect<br>(guards 1.2 / 2.1 migrations)</span>
 <span class=&quot;st st-done&quot;>Closed — 12 Sep</span>
 </div>
 <div class=body>
 <h3>The migration drift guard is silently broken — it can never report a missing migration</h3>
 <p>
 <span class=ref>scripts/check-migrations.sh</span> exists to stop exactly the failure the
 July audit found: shipping code that assumes migrations production doesn't have. It parses a
 pipe-delimited table. Supabase CLI 2.109.1 emits <strong>JSON</strong>. The row filter
 matches nothing, <code>PENDING</code> is always empty, and the script prints
 <code>PASS</code> unconditionally — including the compliance-critical subset, which would
 never print <code>MISSING</code> no matter what is absent.
 </p>
 <div class=evidence>
 <div><b>scripts/check-migrations.sh:55</b></div>
 <div>  PENDING=$(echo &quot;$LIST&quot; | grep -E '^[[:space:]]*[0-9]{4,}' | awk -F'|' ...)</div>
 <div> </div>
 <div><b>actual CLI output</b></div>
 <div>  {&quot;migrations&quot;:[ ... {&quot;local&quot;:&quot;0042&quot;,&quot;remote&quot;:&quot;&quot;,&quot;time&quot;:&quot;0042&quot;} ]}</div>
 <div> </div>
 <div><b>proof</b>  0042 is genuinely unapplied right now, and the script still says</div>
 <div>        &quot;PASS: every local migration is applied to the remote project.&quot;</div>
 </div>
 <p>
 The unapplied migration today is <code>0042</code>, which is performance-only — it wraps
 <code>auth.uid()</code> as <code>(select auth.uid())</code> and no policy gains or loses a
 row — so nothing is broken in production. The defect is that the safety net is a green light
 that means nothing.
 </p>
 <div class=fix>
 <span class=lbl>Fix</span>
 <p>
 Parse the JSON — pipe through <code>jq -r '.migrations[] | select(.remote==&quot;&quot;) | .local'</code>
 — or pass <code>--output pretty</code> to force the table the script expects. Then re-run
 it and confirm it reports <code>0042</code> as pending before you apply it.
 </p>
 </div>
 </div>
 </section>
 <section class=finding>
 <div class=gutter>
 <span class=fid>H3</span>
 <span class=&quot;sev t-high&quot;>High</span>
 <span class=cite>Export compliance<br>(ITSAppUsesNonExemptEncryption)</span>
 </div>
 <div class=body>
 <h3>The app declares it uses no non-exempt encryption while bundling its own AES-256 implementation</h3>
 <p>
 <code>app.json</code> sets <code>ITSAppUsesNonExemptEncryption: false</code>. The July audit
 justified that as &quot;standard HTTPS/keychain crypto is exempt&quot; — but that isn't what the code
 does. <code>LargeSecureStore</code> encrypts the Supabase session with AES-256-CTR using the
 bundled <code>aes-js</code> library: third-party crypto, in the JS bundle, well above the
 56-bit exemption threshold.
 </p>
 <div class=evidence>
 <div><b>src/lib/supabase.ts</b></div>
 <div>  const encryptionKey = Crypto.getRandomBytes(256 / 8)</div>
 <div>  const cipher = new aesjs.ModeOfOperation.ctr(encryptionKey, new aesjs.Counter(1))</div>
 <div> </div>
 <div><b>app.json</b>  &quot;ITSAppUsesNonExemptEncryption&quot;: false</div>
 </div>
 <p>
 The declaration is probably still correct — what's encrypted is an authentication credential,
 which is the carve-out in Note 4 to Category 5 Part 2, and the key itself lives in the device
 keychain. But this is a legal declaration, not a checkbox, and right now the only written
 reasoning behind it describes code that doesn't exist.
 </p>
 <div class=fix>
 <span class=lbl>Fix</span>
 <p>
 Write the actual reasoning down next to the flag — what is encrypted, why it is an
 access-control credential, which exemption you are relying on — so the declaration is a
 decision you can defend rather than an inherited default. If you'd rather not rely on the
 carve-out at all, the alternative is moving session encryption onto OS-provided crypto.
 </p>
 </div>
 </div>
 </section>

 <p>
 Reviews are user-written text displayed on someone else's profile — a classic harassment
 surface. They are covered by the server-side content filter, and a reader can report the
 <em>author</em> through the profile, so this isn't a gap in Apple's four mandatory features.
 But there's no &quot;report this review,&quot; and <code>ReviewRepository</code> has
 <code>upsertOwn</code> with no delete, so an author can edit a review down but never remove it.
 </p>
 <div class=fix>
 <span class=lbl>Fix</span>
 <p>
 Add <code>'review'</code> to <code>ReportTarget</code> and a report action on
 <code>ReviewCard</code> — the modal, repository, and rate limits already handle everything
 else. Optional, but it removes an argument a reviewer could pick.
 </p>
 </div>
 </div>
 </section>

 <div class=sec-head>
 <h2>Already compliant</h2>
 <p class=sec-note>
 Verified during this pass. These are the areas most first submissions fail, and they're done —
 listed so nobody &quot;improves&quot; them during the pre-submission scramble.
 </p>
 </div>
 <ul class=clear-list>
 <li>
 <span class=k>1.2 UGC, all four</span>
 <span class=v>
 <strong>Filtering</strong> is server-side in Postgres (<code>0032</code>): whole-word regex
 on listing titles and descriptions, message bodies, profile names and bios, and review text,
 with the blocklist revoked from client roles so a patched client can neither skip it nor read
 it. <strong>Reporting</strong> from listings, profiles, and chats. <strong>Blocking</strong>
 with a manage-and-undo screen. <strong>Contact</strong> published in Settings, Terms,
 Privacy, and Guidelines. Plus the zero-tolerance objectionable-content clause Apple looks for,
 in the Terms.
 </span>
 </li>
 <li>
 <span class=k>5.1.1(v) deletion</span>
 <span class=v>
 Real in-app account deletion behind a typed confirmation, backed by
 <code>delete_own_account()</code> — cascades the auth user through profile, listings, saved
 items, messages both directions, notifications, and blocks (<code>0010</code>), and now
 storage objects too (<code>0029</code>, <code>0030</code>). Not a &quot;contact us to delete&quot; link.
 </span>
 </li>
 <li>
 <span class=k>Privacy manifest</span>
 <span class=v>
 Eight <code>NSPrivacyCollectedDataTypes</code> declared, tracking <code>false</code>, and
 crash data correctly marked <em>not linked</em> — backed by the actual Sentry config
 (<code>sendDefaultPii: false</code>, <code>setUser()</code> never called,
 <code>tracesSampleRate: 0</code>). Omissions are deliberate and documented; over-declaring
 is its own rejection risk.
 </span>
 </li>
 <li>
 <span class=k>1.6 data security</span>
 <span class=v>
 Session tokens encrypted at rest with the key in the device keychain. HTTPS only — no
 <code>http://</code>, no hardcoded IPs anywhere, so IPv6-only networks are fine. Anon
 stripped of table privileges (<code>0034</code>, <code>0040</code>), avatars moved to a
 private bucket with signed URLs (<code>0039</code>), trigger functions revoked from PUBLIC
 (<code>0038</code>), rate limits on messages and reports (<code>0036</code>). No secrets in
 the bundle.
 </span>
 </li>
 <li>
 <span class=k>2.1 completeness</span>
 <span class=v>
 No <code>console.*</code> in shipped code, no TODO / FIXME / placeholder strings, no dead
 controls, no Android references in user-facing copy, no private APIs, no OTA updates.
 <code>tsc --noEmit</code> clean, <strong>246 tests passing</strong> across 21 suites,
 architecture guard passing.
 </span>
 </li>
 <li>
 <span class=k>5.1.1 permissions</span>
 <span class=v>
 Photo library and camera are both genuinely used — library for avatars and listing photos,
 camera for listing capture — and both are requested contextually at the moment of use, never
 at launch. Purpose strings name the specific feature. No location, contacts, microphone, or
 tracking permission is requested at all.
 </span>
 </li>
 <li>
 <span class=k>3.1 payments</span>
 <span class=v>
 Nothing to get wrong: physical goods exchanged in person, no payment processing in the app,
 no digital content, no external purchase links. Correctly outside In-App Purchase under
 3.1.3(e).
 </span>
 </li>
 <li>
 <span class=k>4.8 / 5.6.1</span>
 <span class=v>
 Email and password only — no social login, so no Sign in with Apple obligation. No custom
 &quot;rate us&quot; prompt anywhere, so no 5.6.1 exposure.
 </span>
 </li>
 <li>
 <span class=k>App icon</span>
 <span class=v>
 1024×1024, RGB, <strong>no alpha channel</strong> — the single most common asset rejection,
 already avoided.
 </span>
 </li>
 </ul>
 
 <div class=sec-head>
 <h2>App Store Connect checklist</h2>
 <p class=sec-note>
 Everything above lives in the repo. This is the other half — the parts of the submission that
 exist only in App Store Connect, in the order they'll be asked for.
 </p>
 </div>
 <ul class=checks>
 <li><strong>Privacy Policy URL</strong> — hosted, not the in-app screen<span class=tag>B1</span></li>
 <li><strong>Support URL</strong> — a page, not a mailto:<span class=tag>B1</span></li>
 <li><strong>App Privacy labels</strong> — must match the eight types in the privacy manifest exactly; a mismatch between manifest, labels, and runtime behaviour is the largest single 5.1.1 rejection cause<span class=tag>5.1.1</span></li>
 <li><strong>Age rating questionnaire</strong> — including the social media capability questions<span class=tag>M5</span></li>
 <li><strong>Demo account credentials in Review Notes</strong> — two accounts, with the &quot;safe to delete&quot; note<span class=tag>B3</span></li>
 <li><strong>Review Notes: explain the <code>@uwo.ca</code> gate</strong> — say plainly that signup is restricted to verified Western University addresses and the reviewer must use the demo login<span class=tag>2.1</span></li>
 <li><strong>Review Notes: point at the safety features</strong> — where report, block, blocked-users, and the guidelines live, so the reviewer doesn't have to find them<span class=tag>1.2</span></li>
 <li><strong>Screenshots</strong> — the app in use, on 6.9&quot; and 6.5&quot; iPhone; never the login or splash screen<span class=tag>2.3.3</span></li>
 <li><strong>Category</strong> — Shopping, most likely<span class=tag>2.3.5</span></li>
 <li><strong>Export compliance answer</strong> — matches <code>ITSAppUsesNonExemptEncryption</code><span class=tag>H3</span></li>
 <li><strong>Description free of other-platform references</strong> — no Android, no Google Play<span class=tag>2.3.10</span></li>
 <li><strong>Seed the demo accounts with real content</strong> — listings, photos, a conversation, a review<span class=tag>2.1</span></li>
 <li><strong>Install a TestFlight build on a physical iPhone and walk every flow</strong> before submitting — this codebase has never produced a native binary<span class=tag>B2</span></li>
