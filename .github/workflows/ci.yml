name: CI

# AX-902 — CI pipeline + architecture guards.
# Runs typecheck, the mechanical architecture guard, and the test suite on every
# push and pull request.

on:
  push:
  pull_request:
  # The drift job below needs network, a linked project and a token, so it
  # cannot run on every push. Once a day, plus on demand.
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, guards & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Prefer a clean, lockfile-faithful install; fall back to `npm install`
        # if the lockfile and package.json are ever briefly out of sync.
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Architecture guards
        run: npm run check:arch

      - name: Tests
        run: npm test

  drift:
    name: Migration drift vs production
    runs-on: ubuntu-latest
    # Never on pull_request: secrets are not exposed to fork PRs, so the job
    # would fail for reasons that say nothing about the change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Link the Supabase project
        # SUPABASE_PROJECT_REF is a repository variable, not a secret — it is
        # already public in the project URL that ships inside the JS bundle.
        # SUPABASE_ACCESS_TOKEN is a personal access token and IS a secret.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret or SUPABASE_PROJECT_REF variable is not set — skipping the drift check."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          npx --no-install supabase link --project-ref "$PROJECT_REF"

      - name: Check for drift
        if: env.SKIP != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run check:migrations
